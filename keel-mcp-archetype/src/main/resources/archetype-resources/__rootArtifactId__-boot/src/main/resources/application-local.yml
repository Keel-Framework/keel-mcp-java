# application-local.yml
server:
  ssl:
    enabled: false

keel:
  adapters:
    rest-client:
      ssl:
        enabled: false
        trust-store: ${TRUSTSTORE_LOCAL}
        trust-store-password: ${TRUSTSTORE_PASSWORD}
        trust-store-type: ${TRUSTSTORE_TYPE}
      services: {}
        #   name-service:
        #     base-url:     https://api.ejemplo.sca.es
        #     log-requests: true

  mcp:
    transport:
      session:
        max-sessions: 500
        timeout: 30m
        log-events: false
      auth:
        enabled: false
        jwt:
          issuer: ${JWT_ISSUER}
          jwks-uri: ${JWKS_URI}
          audience: ${JWT_AUDIENCE}
          jwks-ttl: 1h
      cors:
        enabled: false
        allowed-origins: [ ]

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO